name: silver's TV build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /
          free -h

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare runtime properties
        run: touch local.properties

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --no-daemon --max-workers=3 --console=plain "-Dorg.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx3g 2>&1 | tee build.log

      - name: Error summary
        if: failure()
        run: grep -n -E "^e: |What went wrong|Execution failed|error:|OutOfMemory|Java heap space|Caused by" build.log | head -40 || true

      - uses: actions/upload-artifact@v4
        with:
          name: silvers-tv-apk
          path: androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14
